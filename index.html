
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Litio Dashboard • SQM</title>

    <!-- PWA Primary Meta Tags -->
    <meta name="theme-color" content="#1e293b">
    <meta name="description" content="Sistema de Gestión Logística e Informe Operativo SQM Litio">
    <link rel="manifest" href="manifest.json">

    <!-- iOS Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Litio DB">
    <link rel="apple-touch-icon" href="https://www.sqm.com/wp-content/uploads/2021/03/logo-sqm-header.svg">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@300;400;600;700;900&display=swap"
        rel="stylesheet">

    <!-- External Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://js.puter.com/v2/"></script>

    <style>
        body {
            font-family: 'Source Sans Pro', sans-serif;
            background-color: #ffffff;
            margin: 0;
            padding: 0;
            color: #262730;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .no-page-break {
            page-break-inside: avoid !important;
        }

        .page-break-before {
            page-break-before: always !important;
        }

        .page-break-after {
            page-break-after: always !important;
        }

        /* Control de visibilidad para PDF */
        .pdf-only {
            display: none !important;
        }

        .pdf-only-block {
            display: none !important;
        }

        .is-exporting .pdf-only {
            display: flex !important;
        }

        .is-exporting .pdf-only-block {
            display: block !important;
        }

        .is-exporting .no-pdf,
        .is-exporting .no-print {
            display: none !important;
        }

        @media print {
            .no-print {
                display: none !important;
            }
            .pdf-only {
                display: flex !important;
            }
            .pdf-only-block {
                display: block !important;
            }
            .no-pdf {
                display: none !important;
            }
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>

    <link rel="stylesheet" href="/index.css">
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
    "@google/genai": "https://esm.sh/@google/genai@^1.39.0",
    "recharts": "https://esm.sh/recharts@^3.7.0",
    "vite": "https://esm.sh/vite@^7.3.1",
    "path": "https://esm.sh/path@^0.12.7",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2",
    "xlsx": "https://esm.sh/xlsx@^0.18.5",
    "@/": "./"
  }
}
</script>
</head>

<body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('PWA Service Worker registrado con éxito'))
                    .catch(err => console.warn('Error registrando SW:', err));
            });
        }
    </script>
</body>

</html>
